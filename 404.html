<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Nera Safaris</title>
<meta name="description" content="Sorry, the page you are looking for does not exist. Return home to Nera Safaris to discover authentic Tanzania experiences.">
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #0f1115;
    --text: #f5efe0;
    --text-muted: rgba(245, 239, 224, 0.7);
    --gold: #c5a880;
    --gold-light: #d4bfa0;
    --sans: 'Montserrat', sans-serif;
    --serif: 'Playfair Display', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: var(--dark);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .wrap { max-width: 560px; }
  .eyebrow {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--gold);
    display: block;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.4rem, 7vw, 4rem);
    line-height: 1.1;
    margin-bottom: 1rem;
  }
  p { color: var(--text-muted); font-size: 1.02rem; margin-bottom: 2rem; }
  .btn {
    display: inline-block;
    padding: 1rem 2.25rem;
    background: var(--gold);
    color: var(--dark);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    font-weight: 600;
    border-radius: 2px;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .btn:hover { background: var(--gold-light); transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="wrap">
    <span class="eyebrow">404 &middot; Lost Trail</span>
    <h1>Page Not Found</h1>
    <p>Sorry, the page you were looking for does not exist or has moved. Maybe it's the perfect time to head back and start your real Tanzania journey.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
